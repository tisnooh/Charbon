<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Charbon</title>
    <meta name="description" content="Écrire à l’équipe Charbon : question, bug, suggestion." />
    <link rel="icon" type="image/svg+xml" href="/favicon-site.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="wrap nav__inner">
        <a class="nav__brand" href="/">Charbon</a>
        <div class="nav__links"><a class="btn-cta" data-app-link href="/app/">Ouvrir l’app</a></div>
      </div>
    </nav>

    <main class="legal">
      <span class="eyebrow">Contact</span>
      <h1>Écrivez-nous</h1>
      <p class="updated">Question, bug, idée de fonctionnalité : nous lisons tout.</p>

      <div id="contact-status" class="form-msg" hidden role="status"></div>

      <form id="contact-form" class="contact-form" novalidate>
        <div>
          <label for="cf-name">Votre nom</label>
          <input id="cf-name" name="name" type="text" maxlength="80" required autocomplete="name" placeholder="Prénom ou pseudo" />
        </div>
        <div>
          <label for="cf-email">Votre e-mail</label>
          <input id="cf-email" name="email" type="email" required autocomplete="email" placeholder="vous@exemple.com" />
        </div>
        <div>
          <label for="cf-message">Message</label>
          <textarea id="cf-message" name="message" maxlength="3000" required placeholder="Décrivez votre demande…"></textarea>
        </div>
        <button class="btn-cta" type="submit">Envoyer</button>
        <p style="color: var(--faint); font-size: 13px">
          Votre message est enregistré sur notre serveur et traité par l’équipe. Voir la
          <a href="/privacy.html">politique de confidentialité</a>.
        </p>
      </form>
    </main>

    <footer>
      <div class="wrap">© <span data-year>2026</span> Charbon · <a href="/privacy.html">Confidentialité</a> · <a href="/terms.html">Conditions</a></div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
